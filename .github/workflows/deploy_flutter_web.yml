name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'flutter/**'
      - '.github/workflows/deploy_flutter_web.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configuration de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Téléchargement des dépendances
        working-directory: ./flutter
        run: flutter pub get

      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build Web JS bundle
        working-directory: ./flutter/web/js
        run: |
          set -euxo pipefail
          yarn install --frozen-lockfile --non-interactive
          yarn list --pattern "libsodium|libsodium-wrappers"
          yarn build

      - name: Vérifier que le bundle JS existe
        run: |
          test -s flutter/web/js/dist/index.js
          test -s flutter/web/js/dist/vendor.js
          rm -rf flutter/web/js/node_modules

      - name: Compilation de Flutter Web
        working-directory: ./flutter
        run: flutter build web --base-href "/rustdesk/"

      - name: Vérifier le résultat du build
        run: |
          test -s flutter/build/web/main.dart.js
          test -s flutter/build/web/js/dist/index.js
          test -s flutter/build/web/js/dist/vendor.js
          touch flutter/build/web/.nojekyll

      - name: Déploiement sur GitHub Pages (branche gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flutter/build/web
          publish_branch: gh-pages
